<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iara Suite - Editor Jurídico</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- CONTAINER PRINCIPAL -->
    <div class="app-container">
        
        <!-- SIDEBAR (Navegação) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">⚖️</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="projects">
                    <span class="nav-icon">📁</span>
                    <span class="nav-label">Projetos</span>
                </a>
                <a href="#" class="nav-item" data-page="chat">
                    <span class="nav-icon">💬</span>
                    <span class="nav-label">Chat</span>
                </a>
                <a href="#" class="nav-item" data-page="playground">
                    <span class="nav-icon">▶️</span>
                    <span class="nav-label">Playground</span>
                </a>
                <a href="#" class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Config</span>
                </a>
            </nav>
            
            <div class="sidebar-user">
                <button class="btn-user" onclick="showUserMenu()">
                    <span class="user-avatar">👤</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            
            <!-- HEADER -->
            <header class="header">
                <div class="header-left">
                    <button class="btn-menu" onclick="toggleSidebar()">☰</button>
                    <h1 class="header-title">Iara Suite</h1>
                </div>
                <div class="header-right">
                    <button class="btn-icon" onclick="toggleTheme()">🌙</button>
                </div>
            </header>

            <!-- CONTENT AREA -->
            <div class="content-area">
                <!-- Páginas são injetadas aqui -->
                <div id="pages-container"></div>
            </div>

        </main>

    </div>

    <!-- MODALS -->
    <div id="modals-container"></div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container"></div>


    <!-- SCRIPTS MODULARES (Ordem importa!) -->
    <script src="js/00-utils.js"></script>
    <script src="js/01-supabase-client.js"></script>
    <script src="js/02-auth-module.js"></script>
    <script src="js/03-projects-module.js"></script>
    <script src="js/04-editor-module.js"></script>
    <script src="js/05-chat-module.js"></script>
    <script src="js/06-playground-module.js"></script>
    <script src="js/07-settings-module.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
